name: EAOS Production CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.14
      uses: actions/setup-python@v4
      with:
        python-version: "3.14"
    - name: Install uv
      run: curl -sSf https://astral.sh/uv/install.sh | sh
    - name: Run Architecture Quality Gates
      run: |
        uv run task lint
        uv run task test
        uv run task validate